<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LabourConnect - Worker Registration</title>
<style>
:root{--orange:#f57c00;--orange-d:#e65100;--navy:#12263f;--muted:#6b7280;--line:#eadfce}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:linear-gradient(135deg,#fff3e0,#fffaf3 60%);min-height:100vh;display:grid;place-items:center;padding:20px;color:#1f2937}
.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:34px 30px;width:min(460px,100%);box-shadow:0 6px 20px rgba(18,38,63,.08)}
.logo{text-align:center;margin-bottom:6px}
.logo .mark{width:56px;height:56px;border-radius:16px;background:var(--orange);display:inline-grid;place-items:center;font-size:1.8rem}
h1{text-align:center;color:var(--navy);font-size:1.6rem;margin-top:10px}
p.sub{text-align:center;color:var(--muted);margin:4px 0 22px}
label{display:block;font-weight:600;font-size:.9rem;margin-bottom:5px;color:var(--navy)}
.f{margin-bottom:14px}
input,select{width:100%;padding:12px 13px;border:1px solid #d9cdb9;border-radius:12px;font:inherit;background:#fff}
input:focus,select:focus{outline:2px solid var(--orange);border-color:transparent}
button{width:100%;padding:12px;border:0;border-radius:999px;background:var(--orange);color:#fff;font:inherit;font-weight:700;cursor:pointer}
button:hover{background:var(--orange-d)}
.msg{margin-bottom:12px;padding:10px 12px;border-radius:10px;font-size:.9rem;display:none}
.msg.err{display:block;background:#fdecea;color:#b71c1c}
.msg.ok{display:block;background:#e8f5e9;color:#2e7d32}
.links{text-align:center;margin-top:16px;font-size:.92rem;color:var(--muted)}
.links a{color:var(--orange-d);font-weight:600}
#wk{display:none}
</style>
</head>
<body>
<main class="card">
  <div class="logo"><span class="mark">👷</span></div>
  <h1>LabourConnect</h1>
  <p class="sub">Create your account</p>
  <div id="msg" class="msg" role="alert"></div>
  <form id="form">
    <div class="f"><label for="name">Full name</label><input id="name" required autocomplete="name"></div>
    <div class="f"><label for="email">Email</label><input id="email" type="email" required autocomplete="email"></div>
