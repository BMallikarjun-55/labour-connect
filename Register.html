<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Account - LabourConnect</title>

  <link rel="stylesheet" href="style.css">

  <style>
    /* ================================
       REGISTER PAGE
    ================================= */

    .register-page {
      min-height: 100vh;
      background: linear-gradient(135deg, #eef6ff, #f8fbff);
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .register-container {
      width: 100%;
      max-width: 850px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.10);
      overflow: hidden;
    }

    .register-header {
      background: linear-gradient(135deg, #172554, #2563eb);
      color: white;
      text-align: center;
      padding: 35px 20px;
    }

    .register-logo {
      font-size: 55px;
      margin-bottom: 10px;
    }

    .register-header h1 {
      margin: 0;
      font-size: 30px;
    }

    .register-header p {
      margin-top: 8px;
      opacity: 0.9;
    }

    .register-form {
      padding: 35px;
    }

    .form-title {
      text-align: center;
      color: #172554;
      margin-bottom: 25px;
    }

    .form-title h2 {
      margin-bottom: 8px;
    }

    .form-title p {
      color: #64748b;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      color: #172554;
      margin-bottom: 8px;
    }

    .required {
      color: #dc2626;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      font-size: 15px;
      outline: none;
      background: white;
    }

    .form-group input:focus,
    .form-group select:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
    }

    .password-box {
      position: relative;
    }

    .password-box input {
      padding-right: 75px;
    }

    .show-password {
      position: absolute;
      right: 10px;
      top: 9px;
      border: none;
      background: transparent;
      color: #2563eb;
      cursor: pointer;
      font-weight: 600;
    }

    .password-strength {
      height: 5px;
      background: #e2e8f0;
      border-radius: 10px;
      margin-top: 8px;
      overflow: hidden;
    }

    .strength-bar {
      width: 0%;
      height: 100%;
      transition: 0.3s;
    }

    .role-section {
      margin: 10px 0 25px;
    }

    .role-title {
      font-weight: 600;
      color: #172554;
      margin-bottom: 12px;
    }

    .role-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .role-option {
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      padding: 18px;
      cursor: pointer;
      text-align: center;
      transition: 0.2s;
    }

    .role-option:hover {
      border-color: #2563eb;
    }

    .role-option input {
      margin-right: 7px;
    }

    .role-icon {
      font-size: 30px;
      display: block;
      margin-bottom: 7px;
    }

    .terms {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 10px 0 22px;
      color: #475569;
      font-size: 14px;
    }

    .terms input {
      margin-top: 3px;
    }

    .terms a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
    }

    .register-submit {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .register-submit:hover {
      background: #1d4ed8;
    }

    .login-link {
      text-align: center;
      margin-top: 22px;
      color: #64748b;
    }

    .login-link a {
      color: #2563eb;
      font-weight: bold;
      text-decoration: none;
    }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 15px;
      color: #172554;
      text-decoration: none;
      font-size: 14px;
    }

    .security-note {
      margin-top: 25px;
      padding: 14px;
      background: #f1f5f9;
      border-radius: 10px;
      text-align: center;
      font-size: 13px;
      color: #64748b;
    }

    /* MOBILE */

    @media (max-width: 650px) {

      .register-page {
        padding: 15px;
      }

      .register-form {
        padding: 25px 20px;
      }

      .form-row {
        grid-template-columns: 1fr;
        gap: 0;
      }

      .role-options {
        grid-template-columns: 1fr;
      }

      .register-header h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

<div class="register-page">

  <div class="register-container">

    <!-- HEADER -->
    <div class="register-header">

      <div class="register-logo">👷</div>

      <h1>LabourConnect</h1>

      <p>Join our community and find the right opportunity</p>

    </div>


    <!-- FORM -->
    <div class="register-form">

      <div class="form-title">

        <h2>Create Your Account</h2>

        <p>Fill in your details to get started</p>

      </div>


      <form onsubmit="createAccount(event)">


        <!-- ACCOUNT TYPE -->

        <div class="role-section">

          <div class="role-title">
            I want to:
          </div>

          <div class="role-options">

            <label class="role-option">

              <span class="role-icon">👷</span>

              <input
                type="radio"
                name="role"
                value="worker"
                required
              >

              Find Work

            </label>


            <label class="role-option">

              <span class="role-icon">🏢</span>

              <input
                type="radio"
                name="role"
                value="employer"
              >

              Hire Workers

            </label>

          </div>

        </div>


        <!-- NAME + PHONE -->

        <div class="form-row">

          <div class="form-group">

            <label>
              Full Name <span class="required">*</span>
            </label>

            <input
              type="text"
              id="fullName"
              placeholder="Enter your full name"
              required
            >

          </div>


          <div class="form-group">

            <label>
              Phone Number <span class="required">*</span>
            </label>

            <input
              type="tel"
              id="phone"
              placeholder="Enter phone number"
              maxlength="10"
              required
            >

          </div>

        </div>


        <!-- EMAIL + LOCATION -->

        <div class="form-row">

          <div class="form-group">

            <label>
              Email Address
            </label>

            <input
              type="email"
              id="email"
              placeholder="example@email.com"
            >

          </div>


          <div class="form-group">

            <label>
              Location <span class="required">*</span>
            </label>

            <input
              type="text"
              id="location"
              placeholder="City / Village"
              required
            >

          </div>

        </div>


        <!-- WORK DETAILS -->

        <div class="form-row">

          <div class="form-group">

            <label>
              Work Category
            </label>

            <select id="category">

              <option value="">
                Select category
              </option>

              <option>Construction</option>

              <option>Mason</option>

              <option>Painter</option>

              <option>Electrician</option>

              <option>Plumber</option>

              <option>Carpenter</option>

              <option>Cleaning</option>

              <option>Farming</option>

              <option>Driver</option>

              <option>Other</option>

            </select>

          </div>


          <div class="form-group">

            <label>
              Experience
            </label>

            <select id="experience">

              <option value="">
                Select experience
              </option>

              <option>Fresher</option>

              <option>1 Year</option>

              <option>2 Years</option>

              <option>3 Years</option>

              <option>5+ Years</option>

              <option>10+ Years</option>

            </select>

          </div>

        </div>


        <!-- PASSWORD -->

        <div class="form-row">

          <div class="form-group">

            <label>
              Password <span class="required">*</span>
            </label>

            <div class="password-box">

              <input
                type="password"
                id="password"
                placeholder="Create password"
                minlength="6"
                oninput="checkPassword()"
                required
              >

              <button
                type="button"
                class="show-password"
                onclick="togglePassword()"
              >
                Show
              </button>

            </div>

            <div class="password-strength">
              <div
                id="strengthBar"
                class="strength-bar">
              </div>
            </div>

          </div>


          <div class="form-group">

            <label>
              Confirm Password <span class="required">*</span>
            </label>

            <input
              type="password"
              id="confirmPassword"
              placeholder="Confirm password"
              minlength="6"
              required
            >

          </div>

        </div>


        <!-- TERMS -->

        <div class="terms">

          <input
            type="checkbox"
            id="terms"
            required
          >

          <label for="terms">

            I agree to the
            <a href="#">Terms & Conditions</a>
            and
            <a href="#">Privacy Policy</a>.

          </label>

        </div>


        <!-- BUTTON -->

        <button
          type="submit"
          class="register-submit"
        >
          Create Account
        </button>


      </form>


      <!-- LOGIN -->

      <div class="login-link">

        Already have an account?

        <a href="login.html">
          Sign In
        </a>

      </div>


      <!-- HOME -->

      <a
        href="index.html"
        class="back-home"
      >
        ← Back to Home
      </a>


      <div class="security-note">

        🔒 Your account information should be handled securely.

      </div>

    </div>

  </div>

</div>


<script>

function togglePassword() {

  const password =
    document.getElementById("password");

  const button =
    document.querySelector(".show-password");

  if (password.type === "password") {

    password.type = "text";

    button.textContent = "Hide";

  } else {

    password.type = "password";

    button.textContent = "Show";

  }

}


function checkPassword() {

  const password =
    document.getElementById("password").value;

  const bar =
    document.getElementById("strengthBar");

  let strength = 0;

  if (password.length >= 6)
    strength += 1;

  if (password.length >= 8)
    strength += 1;

  if (/[A-Z]/.test(password))
    strength += 1;

  if (/[0-9]/.test(password))
    strength += 1;

  if (/[^A-Za-z0-9]/.test(password))
    strength += 1;


  if (strength <= 1) {

    bar.style.width = "25%";

  } else if (strength <= 3) {

    bar.style.width = "60%";

  } else {

    bar.style.width = "100%";

  }

}


function createAccount(event) {

  event.preventDefault();


  const password =
    document.getElementById("password").value;

  const confirmPassword =
    document.getElementById("confirmPassword").value;


  if (password !== confirmPassword) {

    alert("Passwords do not match.");

    return;

  }


  const name =
    document.getElementById("fullName").value;


  alert(
    "Welcome to LabourConnect, " +
    name +
    "!"
  );


  window.location.href =
    "index.html";

}

</script>

</body>
        </html>
