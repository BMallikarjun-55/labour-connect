<!DOCTYPE html>
<html>
<head>
    <title>LabourConnect - Worker Registration</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="register-container">

    <h1>LabourConnect</h1>
    <h2>Worker Registration</h2>

    <form id="workerForm">

        <input type="text" id="workerId" placeholder="Worker ID" required>

        <input type="text" id="name" placeholder="Full Name" required>

        <input type="text" id="workType" placeholder="Work Type" required>

        <input type="number" id="experience" placeholder="Experience (Years)" required>

        <input type="text" id="location" placeholder="Location" required>

        <input type="number" id="wage" placeholder="Daily Wage ₹" required>

        <input type="text" id="skills" placeholder="Skills" required>

        <input type="text" id="languages" placeholder="Languages" required>

        <input type="tel" id="phone" placeholder="Phone Number" required>

        <button type="submit">Register Worker</button>

    </form>

    <p id="message"></p>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


// 🔴 PASTE YOUR FIREBASE CONFIG HERE

const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


document.getElementById("workerForm").addEventListener("submit", async function(event) {

    event.preventDefault();

    try {

        await addDoc(collection(db, "workers"), {

            workerId: document.getElementById("workerId").value,
            name: document.getElementById("name").value,
            workType: document.getElementById("workType").value,
            experience: document.getElementById("experience").value,
            location: document.getElementById("location").value,
            wage: document.getElementById("wage").value,
            skills: document.getElementById("skills").value,
            languages: document.getElementById("languages").value,
            phone: document.getElementById("phone").value,

            createdAt: new Date()

        });

        document.getElementById("message").innerText =
            "✅ Worker registered successfully!";

        document.getElementById("workerForm").reset();

    } catch (error) {

        console.error(error);

        document.getElementById("message").innerText =
            "❌ Error saving worker data.";

    }

});

</script>

</body>
</html>
