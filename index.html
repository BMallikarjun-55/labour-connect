<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Labour Connect</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>Labour Connect</h1>
  <p>Find Work • Hire Workers</p>
</header>

<section class="hero">
  <h2>Find the Right Worker for Your Work</h2>
  <p>Connect workers and people looking for skilled labour.</p>

  <button onclick="showWorkers()">Find Workers</button>
  <button onclick="showJob()">Looking for Work</button>
</section>

<section id="content" class="cards">

  <div class="card">
    <h3>👷 Mason</h3>
    <p>Construction and building work</p>
    <button>Contact</button>
  </div>

  <div class="card">
    <h3>🔧 Electrician</h3>
    <p>Electrical installation and repair</p>
    <button>Contact</button>
  </div>

  <div class="card">
    <h3>🎨 Painter</h3>
    <p>House and building painting</p>
    <button>Contact</button>
  </div>

</section>

<footer>
  <p>© 2026 Labour Connect</p>
</footer>

<script src="script.js"></script>

</body>
</html>
