<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LabourConnect - Find Work & Hire Workers</title>
<meta name="description" content="LabourConnect connects skilled and unskilled workers with people who need reliable labour, quickly and easily.">
<style>
:root{
  --orange:#f57c00; --orange-d:#e65100; --navy:#12263f; --ink:#1f2937; --muted:#6b7280;
  --bg:#fffaf3; --card:#ffffff; --line:#eadfce; --green:#2e7d32; --radius:16px;
  --shadow:0 6px 20px rgba(18,38,63,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);line-height:1.55}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
.container{width:min(1140px,92%);margin:0 auto}
section{padding:64px 0}
h2.title{font-size:clamp(1.6rem,3vw,2.1rem);color:var(--navy)}
.sub{color:var(--muted);margin-top:4px}
.head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:28px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:999px;border:2px solid var(--orange);font-weight:600;transition:.2s;background:transparent;color:var(--orange-d)}
.btn:hover{transform:translateY(-1px)}
.btn.primary{background:var(--orange);color:#fff}
.btn.primary:hover{background:var(--orange-d);border-color:var(--orange-d)}
.btn.small{padding:7px 14px;font-size:.88rem}
.btn.dark{background:var(--navy);border-color:var(--navy);color:#fff}

/* header */
header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:68px;gap:16px}
.logo{display:flex;align-items:center;gap:10px}
.logo .mark{width:42px;height:42px;border-radius:12px;background:var(--orange);display:grid;place-items:center;font-size:1.4rem}
.logo b{display:block;font-size:1.2rem;color:var(--navy);line-height:1.1}
