<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LabourConnect - Find Work & Hire Workers</title>
<style>
:root{--navy:#12264a;--blue:#0b5ed7;--amber:#fbb117;--ink:#17233d;--muted:#5a6785;--line:#d9e2f1;--sky:#e3f0fd}
*{box-sizing:border-box}
body{margin:0;font:16px/1.55 "Segoe UI",system-ui,Arial,sans-serif;color:var(--ink);background:#fff}
h1,h2,h3{margin:0;line-height:1.15;color:var(--navy)}
a{color:inherit;text-decoration:none;cursor:pointer}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.wrap{max-width:1160px;margin:0 auto;padding:0 24px}
.btn{display:inline-flex;align-items:center;gap:8px;border:2px solid transparent;border-radius:10px;padding:13px 24px;font-weight:700}
.b-blue{background:var(--blue);color:#fff}.b-blue:hover{background:#094db0}
.b-amber{background:var(--amber);color:var(--navy)}
.b-out{background:#fff;border-color:var(--line);color:var(--navy)}
.b-line{background:transparent;border-color:#fff;color:#fff;padding:9px 20px}
header{background:var(--navy);color:#fff;position:sticky;top:0;z-index:30}
.nav{display:flex;align-items:center;gap:32px;height:74px}
.logo{font:800 28px "Segoe UI",sans-serif;display:flex;align-items:center;gap:10px}
.logo b{color:var(--amber)}.logo small{display:block;font:400 12px/1 sans-serif;letter-spacing:.08em;opacity:.85;margin-top:3px}
.menu{display:flex;gap:30px;margin:0 auto 0 12px}
.menu a{padding:8px 0;border-bottom:3px solid transparent;font-weight:500}
.menu a.on{border-color:var(--amber)}
.acct{display:flex;gap:12px;align-items:center}
.hi{font-weight:600}
@media(max-width:860px){.menu{display:none}.nav{gap:12px}.logo small{display:none}.logo{font-size:22px}.hi{display:none}}
.hero{background:linear-gradient(120deg,var(--sky),#eef6ff);overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.05fr 1fr;align-items:center;gap:20px;min-height:460px}
.hero h1{font-size:clamp(36px,5vw,58px);font-weight:800}
.hero h1 em{display:block;color:var(--amber);font-style:normal}
.hero p{font-size:18px;margin:20px 0 26px;max-width:46ch}
.cta{display:flex;gap:16px;flex-wrap:wrap}
.sbar{display:flex;margin-top:26px;max-width:520px;border:2px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.sbar input{flex:1;border:0;padding:14px 16px;font:inherit;min-width:0}
