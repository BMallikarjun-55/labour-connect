<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LabourConnect – Find work. Hire workers.</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{--bg:#f6f5f1;--surface:#fff;--ink:#16213a;--muted:#5b6478;--line:#e1e0d9;--brand:#16213a;--brand-ink:#fff;--accent:#f2a900;--accent-ink:#16213a;--soft:#fff3d1;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1524;--surface:#18203a;--ink:#eef0f6;--muted:#a3aac0;--line:#2a3452;--brand:#0a0f1c;--brand-ink:#fff;--soft:#2b2a1c}}
:root[data-theme="dark"]{--bg:#0f1524;--surface:#18203a;--ink:#eef0f6;--muted:#a3aac0;--line:#2a3452;--brand:#0a0f1c;--brand-ink:#fff;--soft:#2b2a1c}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:calc(72px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 "Source Sans 3",system-ui,sans-serif}
h1,h2,h3{font-family:Archivo,system-ui,sans-serif;line-height:1.15;margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--brand);color:var(--brand-ink)}
.nav{display:flex;align-items:center;justify-content:space-between;height:64px;gap:12px}
.logo{font:800 20px Archivo,sans-serif;text-decoration:none;display:flex;align-items:center;gap:8px}
.logo i{display:grid;place-items:center;width:32px;height:32px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-style:normal;font-size:18px}
nav ul{display:flex;gap:6px;list-style:none;margin:0;padding:0}
nav a{display:block;padding:8px 12px;border-radius:8px;text-decoration:none;font-weight:600;font-size:15px;opacity:.9}
nav a:hover{background:rgba(255,255,255,.12)}
.actions{display:flex;gap:8px}
.btn{font:700 15px Archivo,sans-serif;padding:11px 18px;border-radius:10px;border:2px solid transparent;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.btn-accent{background:var(--accent);color:var(--accent-ink)}
.btn-accent:hover{filter:brightness(1.07)}
.btn-ghost{background:transparent;color:inherit;border-color:rgba(255,255,255,.4)}
.btn-line{background:var(--surface);color:var(--ink);border-color:var(--line)}
.menu{display:none;background:none;border:0;color:inherit;font-size:26px;cursor:pointer;padding:6px 10px}
.hero{background:var(--brand);color:var(--brand-ink);padding:56px 0 72px}
.hero h1{font-size:clamp(32px,6vw,56px);font-weight:800;max-width:15ch}
.hero p{max-width:52ch;color:#cfd5e6;font-size:19px;margin:16px 0 28px}
.search{background:var(--surface);color:var(--ink);border-radius:16px;padding:14px;max-width:820px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;font:700 15px Archivo,sans-serif;padding:10px;border-radius:10px;border:2px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
